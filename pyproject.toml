[project]
name = "scenario-uncertainty"
version = "0.1.0"
description = "Conventions and helpers for uncertainty and quality information in scenario data pipelines"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "RISE Dependable and Autonomous Systems" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# Validation of profile files against the bundled JSON Schemas
validate = ["jsonschema>=4.0"]

[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.8", "jsonschema>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scenario_uncertainty"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
